# Per-tag approach-pose overrides for the mission orchestrator.
#
# By default the orchestrator computes each NavigateToPose goal from table
# geometry — the robot parks `approach_standoff_m` outward along the vector from
# the nearest table's CENTRE to the tag (not a true nearest-edge normal), facing
# the tag; a footprint guard pulls the standoff back if the goal would land in a
# table. That works for the simulator's regular layout and is the sane default
# for hardware too.
#
# Use this file to override the result for any tag where geometry doesn't
# capture reality — a leaf-blocked tag that needs a tighter standoff, a tag
# mounted on a shelf where the geometric "outward normal" points the wrong
# way, glare from a window, etc.
#
# Schema:
#
#   overrides:
#     "<tag_id>":
#       yaw:      <radians>           # robot heading at the goal
#       standoff: <metres>            # offset from the tag along its outward normal
#       goal_x:   <metres, map frame> # full position override; pairs with goal_y
#       goal_y:   <metres, map frame>
#
# Each subkey is optional. Missing fields fall back to the geometry result
# (or to `approach_yaw` when geometry can't run). Setting all four of
# goal_x / goal_y / yaw / standoff bypasses geometry entirely.
#
# Standoff is clamped to [0.2, 1.5] m for sanity — values outside that range
# are silently coerced. AprilTag detection on the Orbbec falls off below
# ~0.4 m and above ~0.7 m for our tag size; pick standoffs in that band when
# tuning hardware.
#
# Sim runs leave this file empty. Populate it on the hardware branch as
# needed; the operator can edit + re-launch without rebuilding ROS code.

overrides: {}
