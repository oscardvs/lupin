# teleop_twist_joy parameters for the Xbox Wireless Controller (045e:0b13)
# under ros2 joy. Mapping was probed live with /tmp/joy_round.py against
# *this* controller — the SDL2 default Xbox mapping (LB=4/RB=5) does NOT
# match what we see; LB is reported as button 6 and RB as button 7. Suspect
# the kernel's Bluetooth driver for the Series X|S controller is using a
# non-default mapping table. Re-probe if you swap controllers or kernels.
#
#   axes[0] Left X      axes[2] Right X     axes[4] RT (rest +1, full -1)
#   axes[1] Left Y      axes[3] Right Y     axes[5] LT
#                                           axes[6] D-pad X   axes[7] D-pad Y
#
#   buttons[6] LB     buttons[7] RB
#   (other button indices not yet probed — face buttons / Back / Start /
#    Guide / stick-clicks live somewhere in [0..15] but aren't used here)
#
# Mapping — chassis is mecanum (omni), both sticks used for drive:
#   Left  stick    → translation (linear.x = fwd/back, linear.y = strafe)
#   Right stick X  → angular.yaw (twist in place)
#   LB (button 6)  → enable_button  (dead-man — must be held)
#   RB (button 7)  → enable_turbo_button (boost)
#
# Why LB not LT: teleop_twist_joy's enable_button only takes a *button*
# index. Triggers on this controller are axes (4, 5), so LT can't be the
# dead-man without a custom adapter — LB is the closest button equivalent.
# Without a dead-man, joy_node's continuous "all zeros" stream would pin
# priority on twist_mux and starve Nav2 / the web HMI.
# Negative scales here mirror the HMI's polarityInvertHmi flip
# (see lupin_web/web/src/lib/polarity.ts): Mirte-247264's mecanum drive is
# wired with motor + encoder leads physically reversed in pairs, so the
# vendor cmd_vel frame is rotated 180° about Z relative to the physical
# chassis. Joystick output must be flipped on linear.x, linear.y, and
# angular.yaw to match what the operator expects — otherwise pushing the
# stick forward drives backwards.
teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 6          # LB — dead-man, must be held to drive
    enable_turbo_button: 7    # RB — boost while held

    axis_linear:
      x: 1                    # left stick vertical  → forward/back
      y: 0                    # left stick horizontal → strafe
    scale_linear:               # LB-only normal drive (negated; see header)
      x: -0.2
      y: -0.2
    scale_linear_turbo:         # RB → ~3× faster sprint
      x: -0.6
      y: -0.6

    axis_angular:
      yaw: 2                  # right stick horizontal → yaw
    scale_angular:
      yaw: -0.7
    scale_angular_turbo:
      yaw: -1.4
