# Ideal sensor ranges driving the tulip-health indicator on the HMI.
#
# Each entry gives [min, max] for the "happy" zone in the sensor's natural
# units. Per tag we compute a deviation per sensor — 0 if the value is
# inside the range, otherwise (value - nearest_bound) / range_width clamped
# to [0, 2]. The tag's worst sensor wins; the greenhouse's worst tag wins;
# the tulip reads that final number.
#
# Hardware can override per-deployment by pointing the tulip widget at a
# different ranges yaml (or just keeping these as a sane default).

ranges:
  temperature:
    min: 18
    max: 26
  humidity:
    min: 40
    max: 70
  co2:
    min: 400
    max: 1000
  light:
    min: 200
    max: 800
  soil_moisture:
    min: 30
    max: 60
